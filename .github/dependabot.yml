# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens.
# Security fixes are raised as soon as GitHub learns of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (Vite, lucide, tailwind-merge, …) change behaviour and
    # are planned upgrades, not weekly PRs. Security alerts still appear.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
